  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- TV screen -->
  <rect x="96" y="132" width="320" height="220" rx="36" fill="none" stroke="url(#gold)" stroke-width="22"/>
  <!-- antennas -->
  <line x1="256" y1="132" x2="196" y2="72" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="132" x2="316" y2="72" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <!-- play triangle -->
