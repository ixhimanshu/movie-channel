      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f29b2b"/>
