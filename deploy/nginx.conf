# nginx for the "player" container (docker compose on Easypanel).
#   :80   public  → web player page + /iptv/ (playlist, guide, stream) proxied to ErsatzTV
#   :8080 admin   → full ErsatzTV admin UI + /submit (add a movie by link), behind a password (basic auth)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS; resolve per request so nginx starts even if ersatztv is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ersatztv http://ersatztv:8409;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /iptv/ {
        proxy_pass $ersatztv;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ErsatzTV builds absolute https:// URLs in playlists from these
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ersatztv http://ersatztv:8409;

    auth_basic "Movie Channel admin";
    auth_basic_user_file /etc/nginx/admin.htpasswd;

    client_max_body_size 20m;   # channel logo uploads

    # paste-a-link movie downloader (deploy/submitter.py)
    set $submitter http://submitter:8000;
    location /submit {
        proxy_pass $submitter;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $ersatztv;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the admin UI is Blazor Server and needs websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
